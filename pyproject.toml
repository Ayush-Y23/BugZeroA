[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-incident-fix-agent"
version = "0.1.0"
description = "Service that runs a multi-stage AI pipeline to understand, analyze, and fix code incidents."
authors = [
  { name = "Ayush" }
]
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.4.0",
]

[tool.setuptools.packages.find]
where = ["app"]

